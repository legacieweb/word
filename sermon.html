<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎵 Music Player - God's Church Chieko</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3f 50%, #16213e 100%);
      color: #fff;
      overflow-x: hidden;
    }

    .spotify-gradient {
      background: linear-gradient(135deg, #1db954 0%, #1ed760 100%);
    }

    .dark-card {
      background: rgba(30, 30, 46, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .dark-card:hover {
      background: rgba(40, 40, 60, 0.9);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .album-art {
      width: 280px;
      height: 280px;
      background: linear-gradient(135deg, #1db954, #1ed760);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      box-shadow: 0 20px 60px rgba(29, 185, 84, 0.3);
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    .play-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1db954, #1ed760);
      border: none;
      color: #000;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(29, 185, 84, 0.4);
    }

    .play-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 30px rgba(29, 185, 84, 0.6);
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .control-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .control-btn.active {
      background: linear-gradient(135deg, #1db954, #1ed760);
      color: #000;
      border-color: transparent;
    }

    .queue-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .queue-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-left-color: #1db954;
    }

    .queue-item.playing {
      background: rgba(29, 185, 84, 0.2);
      border-left-color: #1db954;
    }

    .progress-container {
      width: 100%;
      position: relative;
      margin-bottom: 4px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #1db954, #1ed760);
      border-radius: 3px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .progress-bar:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .time-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }

    .header-sticky {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(15, 15, 35, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Preloader Styles */
    .preloader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .preloader-overlay.show {
      display: flex;
    }

    .preloader-content {
      text-align: center;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(29, 185, 84, 0.3);
      border-top: 4px solid #1db954;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .preloader-text {
      color: white;
      font-size: 16px;
      margin-top: 1rem;
    }

    /* Rotating CD Styles */
    .cd-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cd-disc {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #333, #111, #000);
      box-shadow: 
        inset 0 0 20px rgba(0, 0, 0, 0.9),
        inset 0 0 10px rgba(255, 255, 255, 0.1),
        0 0 30px rgba(0, 0, 0, 0.5);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cd-disc::before {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle at 35% 35%, #ffd700, #ffed4e, #daa520);
      border-radius: 50%;
      box-shadow: 
        inset 0 2px 5px rgba(255, 255, 255, 0.4),
        0 2px 5px rgba(0, 0, 0, 0.5);
      z-index: 2;
    }

    .cd-disc::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      background: radial-gradient(circle at 35% 35%, #333, #111);
      border-radius: 50%;
      z-index: 3;
      box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.1);
    }

    .cd-disc.rotating {
      animation: cd-spin 3s linear infinite;
    }

    @keyframes cd-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .cd-rings {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .cd-ring {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Fullscreen Player Styles */
    .player-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3f 50%, #16213e 100%);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .player-fullscreen.show {
      display: flex;
    }

    .player-fullscreen .album-art {
      width: 400px;
      height: 400px;
      font-size: 100px;
      margin-bottom: 2rem;
    }

    .player-fullscreen .dark-card {
      width: 100%;
      max-width: 600px;
    }

    .fullscreen-close-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 28px;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 101;
    }

    .fullscreen-close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Main Player Hidden on Load */
    #mainPlayer {
      display: none !important;
    }

    #mainPlayer.show {
      display: block !important;
    }

    /* Draggable Songs Button */
    .songs-button {
      position: fixed;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      padding: 12px 20px;
      background: linear-gradient(135deg, #1db954, #1ed760);
      color: #000;
      border: none;
      border-radius: 50px;
      font-weight: 700;
      cursor: grab;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(29, 185, 84, 0.4);
      z-index: 75;
      user-select: none;
    }

    .songs-button:hover {
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 12px 30px rgba(29, 185, 84, 0.6);
    }

    .songs-button:active {
      cursor: grabbing;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 85;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-content {
      background: rgba(30, 30, 46, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      width: 100%;
      backdrop-filter: blur(10px);
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(30, 30, 46, 0.9);
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .modal-close-btn:hover {
      transform: rotate(90deg);
    }

    .modal-body {
      padding: 20px;
    }

    .song-list {
      display: grid;
      gap: 10px;
    }

    .song-item {
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .song-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(29, 185, 84, 0.5);
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .song-artist {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .add-song-btn {
      padding: 6px 16px;
      background: linear-gradient(135deg, #1db954, #1ed760);
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 12px;
    }

    .add-song-btn:hover {
      transform: scale(1.05);
    }

    /* Content Area for Albums */
    .content-area {
      max-width: 7xl;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .album-card {
      background: rgba(30, 30, 46, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .album-card:hover {
      background: rgba(30, 30, 46, 0.9);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(29, 185, 84, 0.2);
    }

    .album-card-header {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #1db954, #1ed760);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .album-card-body {
      padding: 16px;
    }

    .album-card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .album-card-info {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .scroll-smooth {
      scroll-behavior: smooth;
    }

    @media (max-width: 768px) {
      .songs-button {
        right: 16px;
        padding: 10px 16px;
        font-size: 14px;
      }

      .album-art {
        width: 200px;
        height: 200px;
        font-size: 60px;
      }

      .play-btn {
        width: 48px;
        height: 48px;
        font-size: 18px;
      }

      .player-fullscreen .album-art {
        width: 280px;
        height: 280px;
        font-size: 70px;
      }

      .modal-content {
        max-width: 90vw;
      }
    }

    @media (max-width: 480px) {
      .album-art {
        width: 150px;
        height: 150px;
        font-size: 40px;
      }

      .control-btn {
        width: 36px;
        height: 36px;
        font-size: 14px;
      }

      .play-btn {
        width: 44px;
        height: 44px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body class="min-h-screen scroll-smooth">

  <!-- Header -->
  <header class="header-sticky py-4">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div>
          <h1 class="text-2xl font-bold">God's Church</h1>
          <p class="text-sm text-gray-400">Music Player</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button onclick="goToDashboard()" class="px-4 py-2 rounded-full text-sm font-semibold border border-gray-600 hover:border-white transition">
          Dashboard
        </button>
        <button onclick="goToHome()" class="px-4 py-2 rounded-full text-sm font-semibold spotify-gradient text-black">
          Home
        </button>
      </div>
    </div>
  </header>

  <!-- Draggable Songs Button -->
  <button class="songs-button" id="songsButton" onmousedown="startDrag(event)">🎵 Songs</button>

  <!-- Preloader Overlay -->
  <div id="preloaderOverlay" class="preloader-overlay">
    <div class="preloader-content">
      <div class="spinner"></div>
      <p class="preloader-text">Loading song...</p>
    </div>
  </div>

  <!-- Songs Modal -->
  <div class="modal-overlay" id="songsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="text-xl font-bold">🎵 All Songs</h2>
        <button class="modal-close-btn" onclick="closeSongsModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="song-list" id="songsList">
          <div class="text-center text-gray-400 py-8">
            <p>Loading songs...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fullscreen Player Container -->
  <div id="fullscreenPlayer" class="player-fullscreen">
    <button onclick="closeFullscreen()" class="fullscreen-close-btn" title="Exit Fullscreen">✕</button>
    
    <div class="dark-card rounded-xl p-4 md:p-8">
      <!-- Album Art with Rotating CD -->
      <div class="mb-8">
        <div class="album-art" id="albumArtFullscreen">
          <div class="cd-container">
            <div class="cd-disc" id="cdDiscFullscreen">
              <div class="cd-rings">
                <div class="cd-ring" style="width: 360px; height: 360px;"></div>
                <div class="cd-ring" style="width: 320px; height: 320px;"></div>
                <div class="cd-ring" style="width: 280px; height: 280px;"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Now Playing Info -->
      <div class="text-center mb-8">
        <p class="text-gray-400 text-sm mb-2">NOW PLAYING</p>
        <h2 class="text-3xl font-bold mb-2" id="nowPlayingTitleFullscreen">Select a song to start</h2>
        <p class="text-gray-400 text-sm" id="nowPlayingArtistFullscreen">-</p>
      </div>

      <!-- Progress Bar -->
      <div class="mb-4">
        <div class="progress-container">
          <div class="progress-bar" id="progressBarFullscreen">
            <div class="progress-fill" id="progressFillFullscreen"></div>
          </div>
        </div>
        <div class="flex justify-between">
          <span class="time-text" id="currentTimeFullscreen">0:00</span>
          <span class="time-text" id="durationFullscreen">0:00</span>
        </div>
      </div>

      <!-- Playback Controls -->
      <div class="flex items-center justify-center gap-4 mb-8">
        <button class="control-btn" onclick="toggleRepeat()" title="Repeat" id="repeatBtnFullscreen">
          🔁
        </button>
        <button class="control-btn" onclick="previousSong()">
          ⏮
        </button>
        <button id="playBtnFullscreen" class="play-btn" onclick="togglePlay()">
          ▶
        </button>
        <button class="control-btn" onclick="nextSong()">
          ⏭
        </button>
        <button id="shuffleBtnFullscreen" class="control-btn" onclick="toggleShuffle()" title="Shuffle">
          🔀
        </button>
      </div>
    </div>
  </div>

  <!-- Main Container -->
  <div class="max-w-7xl mx-auto px-4 py-4 md:py-8" id="mainPlayer">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-8">

      <!-- Now Playing Section (Left) -->
      <div class="md:col-span-2">
        <div class="dark-card rounded-xl p-4 md:p-8">
          
          <!-- Album Art with Rotating CD -->
          <div class="mb-8">
            <div class="album-art" id="albumArt">
              <div class="cd-container">
                <div class="cd-disc" id="cdDisc">
                  <div class="cd-rings">
                    <div class="cd-ring" style="width: 240px; height: 240px;"></div>
                    <div class="cd-ring" style="width: 200px; height: 200px;"></div>
                    <div class="cd-ring" style="width: 160px; height: 160px;"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Now Playing Info -->
          <div class="text-center mb-8">
            <p class="text-gray-400 text-sm mb-2">NOW PLAYING</p>
            <h2 class="text-3xl font-bold mb-2" id="nowPlayingTitle">Select a song to start</h2>
            <p class="text-gray-400 text-sm" id="nowPlayingArtist">-</p>
          </div>

          <!-- Progress Bar Section -->
          <div class="mb-4">
            <div class="progress-container">
              <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
              </div>
            </div>
            <div class="flex justify-between">
              <span class="time-text" id="currentTime">0:00</span>
              <span class="time-text" id="duration">0:00</span>
            </div>
          </div>

          <!-- Playback Controls -->
          <div class="flex items-center justify-center gap-4 mb-8">
            <button id="shuffleBtn" class="control-btn" onclick="toggleShuffle()" title="Shuffle">
              🔀
            </button>
            <button class="control-btn" onclick="previousSong()">
              ⏮
            </button>
            <button id="playBtn" class="play-btn" onclick="togglePlay()">
              ▶
            </button>
            <button class="control-btn" onclick="nextSong()">
              ⏭
            </button>
            <button id="repeatBtn" class="control-btn" onclick="toggleRepeat()" title="Repeat">
              🔁
            </button>
          </div>

          <!-- Control Row -->
          <div class="flex items-center justify-between gap-4">
            <!-- Volume Control -->
            <div class="flex items-center gap-4">
              <input 
                type="range" 
                id="volumeSlider" 
                min="0" 
                max="100" 
                value="70" 
                class="w-32 h-1 bg-gray-600 rounded cursor-pointer"
                onchange="setVolume(this.value)"
                oninput="setVolume(this.value)"
              />
              <button class="control-btn" onclick="toggleMute()">
                🔊
              </button>
            </div>
            
            <!-- Fullscreen Button -->
            <button id="fullscreenBtn" class="control-btn" onclick="enterFullscreen()" title="Fullscreen">
              ⛶
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Albums/Playlists Section (Shows on load) -->
  <div id="albumsSection" class="content-area">
    <h2 class="text-3xl font-bold mb-8">🎵 Popular Playlists</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="albumsGrid">
      <div class="text-center text-gray-400 py-8 col-span-full">Loading albums...</div>
    </div>
  </div>

  <!-- Hidden Audio Element -->
  <audio id="audioPlayer" crossorigin="anonymous"></audio>

  <script>
    // ============ STATE MANAGEMENT ============
    let songs = [];
    let albums = [];
    let currentIndex = 0;
    let isPlaying = false;
    let isShuffle = false;
    let repeatMode = 0;
    let shuffledOrder = [];
    let isSeeking = false;
    let isFullscreen = false;
    let songSelected = false;
    let isDragging = false;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    // ============ INITIALIZATION ============
    async function initPlaylist() {
      await loadSongs();
      await loadAlbums();
      setupAudioEvents();
      updateUI();
      setupSongsButtonClick();
    }

    // ============ LOAD SONGS FROM API ============
    async function loadSongs() {
      try {
        const response = await fetch('https://word-laaq.onrender.com/api/songs');
        if (!response.ok) throw new Error('Failed to load songs');
        songs = await response.json();
        shuffledOrder = [...Array(songs.length).keys()];
        updateSongsList();
      } catch (error) {
        console.error('Error loading songs:', error);
        document.getElementById('songsList').innerHTML = 
          '<p class="text-center text-red-400">Error loading songs</p>';
      }
    }

    // ============ LOAD ALBUMS FROM API ============
    async function loadAlbums() {
      try {
        const response = await fetch('https://word-laaq.onrender.com/api/albums');
        if (!response.ok) throw new Error('Failed to load albums');
        albums = await response.json();
        updateAlbumsUI();
      } catch (error) {
        console.error('Error loading albums:', error);
        document.getElementById('albumsGrid').innerHTML = 
          '<div class="text-center text-red-400 col-span-full py-8">Error loading albums</div>';
      }
    }

    // ============ UPDATE ALBUMS UI ============
    function updateAlbumsUI() {
      const albumsGrid = document.getElementById('albumsGrid');
      
      if (albums.length === 0) {
        albumsGrid.innerHTML = '<div class="text-center text-gray-400 col-span-full py-8">No playlists available</div>';
        return;
      }

      albumsGrid.innerHTML = albums.map((album, idx) => `
        <div class="album-card" onclick="playAlbum(${idx})">
          <div class="album-card-header">
            ${['🎸', '✝️', '🕊️', '🎹', '🎤', '🎺'][idx % 6]}
          </div>
          <div class="album-card-body">
            <div class="album-card-title">${album.title}</div>
            <div class="album-card-info">${album.songs ? album.songs.length : 0} songs • ${album.artist}</div>
          </div>
        </div>
      `).join('');
    }

    // ============ UPDATE SONGS LIST FOR MODAL ============
    function updateSongsList() {
      const songsList = document.getElementById('songsList');
      
      if (songs.length === 0) {
        songsList.innerHTML = '<p class="text-center text-gray-400 py-8">No songs available</p>';
        return;
      }

      songsList.innerHTML = songs.map((song, index) => `
        <div class="song-item">
          <div class="song-info">
            <div class="song-title">${song.title || 'Untitled'}</div>
            <div class="song-artist">${song.artist || "God's Church"}</div>
          </div>
          <button class="add-song-btn" onclick="loadSongFromModal(${index})">Play</button>
        </div>
      `).join('');
    }

    // ============ LOAD SONG FROM MODAL ============
    function loadSongFromModal(index) {
      loadSong(index);
      closeSongsModal();
    }

    // ============ SETUP AUDIO EVENTS ============
    function setupAudioEvents() {
      const audio = document.getElementById('audioPlayer');

      audio.addEventListener('timeupdate', () => {
        if (!isSeeking) {
          const percent = (audio.currentTime / audio.duration) * 100;
          document.getElementById('progressFill').style.width = percent + '%';
          document.getElementById('progressFillFullscreen').style.width = percent + '%';
          updateCurrentTime();
        }
      });

      audio.addEventListener('ended', () => {
        if (repeatMode === 2) {
          audio.currentTime = 0;
          audio.play();
        } else {
          nextSong();
        }
      });

      audio.addEventListener('play', () => {
        isPlaying = true;
        updatePlayButton();
        updateCDRotation();
      });

      audio.addEventListener('pause', () => {
        isPlaying = false;
        updatePlayButton();
        updateCDRotation();
      });

      // Prevent abort error by pausing before loading new song
      audio.addEventListener('loadstart', () => {
        if (isPlaying) {
          audio.pause();
        }
      });

      // Progress bar clicks
      document.getElementById('progressBar').addEventListener('click', (e) => {
        const rect = e.target.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        document.getElementById('audioPlayer').currentTime = percent * document.getElementById('audioPlayer').duration;
      });

      document.getElementById('progressBarFullscreen').addEventListener('click', (e) => {
        const rect = e.target.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        document.getElementById('audioPlayer').currentTime = percent * document.getElementById('audioPlayer').duration;
      });
    }

    // ============ LOAD SONG ============
    function loadSong(index) {
      if (songs.length === 0) return;
      
      showPreloader();
      
      currentIndex = isShuffle ? shuffledOrder[index] : index;
      const song = songs[currentIndex];
      
      if (!song) return;

      songSelected = true;

      // Hide albums section
      document.getElementById('albumsSection').style.display = 'none';

      // Update main player UI
      document.getElementById('nowPlayingTitle').textContent = song.title || 'Untitled';
      document.getElementById('nowPlayingArtist').textContent = song.artist || "God's Church";

      // Update fullscreen player UI
      document.getElementById('nowPlayingTitleFullscreen').textContent = song.title || 'Untitled';
      document.getElementById('nowPlayingArtistFullscreen').textContent = song.artist || "God's Church";

      // Reset progress
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('currentTime').textContent = '0:00';
      
      document.getElementById('progressFillFullscreen').style.width = '0%';
      document.getElementById('currentTimeFullscreen').textContent = '0:00';

      // Stop current playback
      const audio = document.getElementById('audioPlayer');
      audio.pause();
      audio.currentTime = 0;

      // Load audio
      const audioUrl = `https://word-laaq.onrender.com/api/songs/${song._id}/audio`;
      audio.src = audioUrl;
      
      audio.onloadedmetadata = function() {
        hidePreloader();
        updateDuration();
        
        // Show main player
        const mainPlayer = document.getElementById('mainPlayer');
        mainPlayer.classList.remove('player-hidden');
        mainPlayer.classList.add('show');
        
        // Update CD rotation
        updateCDRotation();
        
        // Auto play if was playing
        if (isPlaying) {
          audio.play().catch(err => console.log('Playback failed:', err));
        }
      };

      audio.load();
    }

    // ============ PLAYBACK CONTROLS ============
    function togglePlay() {
      const audio = document.getElementById('audioPlayer');
      if (audio.src) {
        if (isPlaying) {
          audio.pause();
        } else {
          audio.play();
        }
      }
    }

    function nextSong() {
      let nextIndex = currentIndex + 1;
      if (nextIndex >= songs.length) {
        if (repeatMode === 1) {
          nextIndex = 0;
        } else {
          return;
        }
      }
      loadSong(nextIndex);
      if (isPlaying) {
        document.getElementById('audioPlayer').play();
      }
    }

    function previousSong() {
      let prevIndex = currentIndex - 1;
      if (prevIndex < 0) {
        prevIndex = songs.length - 1;
      }
      loadSong(prevIndex);
      if (isPlaying) {
        document.getElementById('audioPlayer').play();
      }
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
      document.getElementById('shuffleBtnFullscreen').classList.toggle('active', isShuffle);
    }

    function toggleRepeat() {
      repeatMode = (repeatMode + 1) % 3;
      const repeatBtn = document.getElementById('repeatBtn');
      const repeatBtnFullscreen = document.getElementById('repeatBtnFullscreen');
      
      repeatBtn.textContent = repeatMode === 0 ? '🔁' : repeatMode === 1 ? '🔁 ∞' : '🔁 1';
      repeatBtnFullscreen.textContent = repeatMode === 0 ? '🔁' : repeatMode === 1 ? '🔁 ∞' : '🔁 1';
      
      repeatBtn.classList.toggle('active', repeatMode !== 0);
      repeatBtnFullscreen.classList.toggle('active', repeatMode !== 0);
    }

    function setVolume(value) {
      document.getElementById('audioPlayer').volume = value / 100;
    }

    function toggleMute() {
      const audio = document.getElementById('audioPlayer');
      if (audio.volume > 0) {
        audio.volume = 0;
      } else {
        audio.volume = 0.7;
      }
    }

    // ============ UI UPDATE FUNCTIONS ============
    function updatePlayButton() {
      const icon = isPlaying ? '⏸' : '▶';
      document.getElementById('playBtn').textContent = icon;
      document.getElementById('playBtnFullscreen').textContent = icon;
    }

    function updateDuration() {
      const audio = document.getElementById('audioPlayer');
      const minutes = Math.floor(audio.duration / 60);
      const seconds = Math.floor(audio.duration % 60);
      const durationText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
      document.getElementById('duration').textContent = durationText;
      document.getElementById('durationFullscreen').textContent = durationText;
    }

    function updateCurrentTime() {
      const audio = document.getElementById('audioPlayer');
      const minutes = Math.floor(audio.currentTime / 60);
      const seconds = Math.floor(audio.currentTime % 60);
      const timeText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
      document.getElementById('currentTime').textContent = timeText;
      document.getElementById('currentTimeFullscreen').textContent = timeText;
    }

    function updateUI() {
      updatePlayButton();
    }

    // ============ CD ROTATION ============
    function updateCDRotation() {
      const cdDisc = document.getElementById('cdDisc');
      const cdDiscFullscreen = document.getElementById('cdDiscFullscreen');
      
      if (isPlaying) {
        cdDisc?.classList.add('rotating');
        cdDiscFullscreen?.classList.add('rotating');
      } else {
        cdDisc?.classList.remove('rotating');
        cdDiscFullscreen?.classList.remove('rotating');
      }
    }

    // ============ FULLSCREEN PLAYER ============
    function enterFullscreen() {
      document.getElementById('fullscreenPlayer').classList.add('show');
    }

    function closeFullscreen() {
      document.getElementById('fullscreenPlayer').classList.remove('show');
    }

    // ============ PRELOADER ============
    function showPreloader() {
      document.getElementById('preloaderOverlay').classList.add('show');
    }

    function hidePreloader() {
      document.getElementById('preloaderOverlay').classList.remove('show');
    }

    // ============ SONGS MODAL ============
    function setupSongsButtonClick() {
      document.getElementById('songsButton').addEventListener('click', (e) => {
        e.preventDefault();
        if (!isDragging) {
          document.getElementById('songsModal').classList.add('show');
        }
      });

      document.getElementById('songsModal').addEventListener('click', (e) => {
        if (e.target.id === 'songsModal') {
          closeSongsModal();
        }
      });
    }

    function closeSongsModal() {
      document.getElementById('songsModal').classList.remove('show');
    }

    // ============ DRAGGABLE SONGS BUTTON ============
    function startDrag(event) {
      if (event.button !== 0) return;
      
      isDragging = false;
      const button = document.getElementById('songsButton');
      const startX = event.clientX;
      const startY = event.clientY;
      const startLeft = button.offsetLeft;
      const startTop = button.offsetTop;
      
      function onMouseMove(e) {
        const moveX = e.clientX - startX;
        const moveY = e.clientY - startY;
        
        if (Math.abs(moveX) > 5 || Math.abs(moveY) > 5) {
          isDragging = true;
        }
        
        if (isDragging) {
          button.style.position = 'fixed';
          button.style.right = 'auto';
          button.style.left = (startLeft + moveX) + 'px';
          button.style.top = (startTop + moveY) + 'px';
        }
      }
      
      function onMouseUp() {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        isDragging = false;
      }
      
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    }

    // ============ ALBUM FUNCTIONS ============
    function playAlbum(albumIndex) {
      const album = albums[albumIndex];
      if (album && album.songs && album.songs.length > 0) {
        const firstSongIndex = songs.findIndex(s => s._id === album.songs[0]._id);
        if (firstSongIndex !== -1) {
          loadSong(firstSongIndex);
          if (!isPlaying) {
            isPlaying = true;
            document.getElementById('audioPlayer').play();
          }
        }
      }
    }

    // ============ NAVIGATION ============
    function goToDashboard() {
      window.location.href = 'dashboard.html';
    }

    function goToHome() {
      window.location.href = 'index.html';
    }

    // ============ INIT ON LOAD ============
    window.addEventListener('load', () => {
      initPlaylist();
    });
  </script>

</body>
</html>
